name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Le pseudonyme du compte n'est écrit nulle part : GitHub le fournit à
# l'exécution. Seul le template XML, statique et lu par Community
# Applications, doit le porter en dur.
env:
  # Surtout pas de préfixe RCLONE_ : rclone interprète toute variable
  # ainsi nommée comme une option. RCLONE_VERSION était lu comme le
  # drapeau booléen --version, et faisait échouer la moindre commande.
  CSM_RCLONE_VERSION: "1.75.1"

jobs:
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Le binaire vient de l'image officielle, celle-là même que notre
      # Dockerfile copie : les tests s'exécutent donc contre *exactement* le
      # rclone que l'application embarquera. Docker vérifie l'empreinte de
      # l'image, ce qui remplace le téléchargement, la somme de contrôle et
      # la décompression — trois occasions de casser en moins.
      - name: Installer rclone ${{ env.CSM_RCLONE_VERSION }}
        run: |
          set -eo pipefail
          docker create --name rclone-src "rclone/rclone:${CSM_RCLONE_VERSION}"
          docker cp rclone-src:/usr/local/bin/rclone /tmp/rclone
          docker rm rclone-src
          sudo install -m 755 /tmp/rclone /usr/local/bin/rclone
          rclone version

      - name: Installer les dépendances
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Suite de tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Compilation frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # `npm run build` est `tsc -b && vite build` : une erreur de type
      # arrête la chaîne ici plutôt qu'à la construction de l'image.
      - name: Vérifier les types et construire
        working-directory: frontend
        run: npm run build

  template:
    name: Validation du template Unraid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Balises exigées par Community Applications
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          required = {
              "Name", "Repository", "Registry", "Network", "Shell", "Privileged",
              "Support", "Project", "Overview", "Category", "TemplateURL",
          }
          root = ET.parse("unraid/cloud-sync-manager.xml").getroot()
          ET.parse("unraid/ca_profile.xml")

          missing = required - {child.tag for child in root}
          if missing:
              sys.exit(f"balises manquantes : {', '.join(sorted(missing))}")
          if root.findtext("Privileged") != "false":
              sys.exit("le template ne doit jamais demander le mode privilégié")
          print("template valide")
          PY

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, template]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Unraid ne tourne que sur x86_64 : une seule plateforme à produire.
      - name: Métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloud-sync-manager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Connexion au registre
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
