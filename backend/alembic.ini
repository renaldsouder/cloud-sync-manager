; Configuration Alembic pour le développement (génération de révisions).
; À l'exécution, les migrations sont pilotées par csm.db.migrate, qui
; construit sa propre Config — le conteneur n'a pas besoin de ce fichier.

[alembic]
script_location = src/csm/migrations
prepend_sys_path = src
sqlalchemy.url = sqlite:///./dev-appdata/db/cloudsyncmanager.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
