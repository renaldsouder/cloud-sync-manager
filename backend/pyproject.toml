[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-sync-manager"
version = "0.2.0"
description = "Synchronisation Cloud pour Unraid — moteur rclone, WebUI, planification"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/csm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = ["error::DeprecationWarning:csm.*"]
